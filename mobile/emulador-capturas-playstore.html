<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emulador de Capturas Google Play - BVV Emergencias</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* MODO CAPTURA DIRECTA (sin bordes para Chrome Headless / exportación exacta) */
    body.capture-mode {
      background: #000;
      display: block;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    body.capture-mode .sidebar,
    body.capture-mode .top-banner {
      display: none !important;
    }
    body.capture-mode .workspace {
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      display: block !important;
    }
    body.capture-mode .device-frame {
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      transform: none !important;
    }

    /* SIDEBAR DE CONTROL */
    .sidebar {
      width: 360px;
      background: #111827;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-header .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
    .brand-header h1 {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .brand-header p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .policy-alert {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #d1fae5;
    }
    .policy-alert strong {
      color: #34d399;
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #94a3b8;
    }

    .screen-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .screen-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .screen-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .screen-btn.active {
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
      color: #fff;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.2);
    }
    .screen-btn .tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      font-weight: 700;
    }

    .format-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .format-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .format-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #fff;
    }

    .action-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      border: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
      transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .action-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .action-btn.secondary {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }

    /* ÁREA CENTRAL DEL EMULADOR */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .top-banner {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: #94a3b8;
      background: rgba(17, 24, 39, 0.8);
      padding: 8px 16px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* MARCO DEL DISPOSITIVO (396x704 equivale a proporción exacta 9:16 -> 1080x1920) */
    .device-frame {
      width: 396px;
      height: 704px;
      background: #000;
      border-radius: 38px;
      border: 10px solid #1e293b;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 0.25s ease, height 0.25s ease;
    }
    .device-frame.tablet {
      width: 525px;
      height: 700px;
      border-radius: 28px;
    }

    /* BARRA DE ESTADO ANDROID */
    .android-status-bar {
      height: 32px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      z-index: 200;
      flex-shrink: 0;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    /* CONTENEDOR DE LA APP */
    .app-screen {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #0f172a 0%, #000000 100%);
      overflow: hidden;
    }

    /* BARRA DE NAVEGACIÓN INFERIOR ANDROID */
    .android-nav-bar {
      height: 24px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 200;
    }
    .nav-pill {
      width: 110px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.35);
    }

    /* ==========================================
       ESTILOS FIELES A mobile/src/app/*.tsx
       ========================================== */

    /* Cabecera Principal (index.tsx) */
    .bvv-header {
      padding: 18px 20px 10px;
      display: flex;
      align-items: center;
      width: 100%;
      z-index: 90;
    }
    .hamburger-btn {
      padding: 10px 13px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .header-titles {
      flex: 1;
      text-align: center;
      margin-right: 44px;
    }
    .bvv-title {
      color: #fff;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .bvv-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Menú Desplegable (index.tsx) */
    .dropdown-menu {
      position: absolute;
      top: 78px;
      left: 20px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 150;
      padding: 8px 0;
      width: 260px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
    }
    .menu-item {
      padding: 14px 18px;
      color: #f8fafc;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .menu-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Contenido Central SOS (index.tsx) */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px 20px;
    }
    .instruction-card {
      background: rgba(30, 41, 59, 0.7);
      border-radius: 16px;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      margin-bottom: 36px;
      max-width: 360px;
      width: 100%;
    }
    .instruction-badge {
      color: #f87171;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .instruction-text {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 19px;
    }

    /* Botón Único Central (index.tsx) */
    .button-outer-pulse {
      width: 256px;
      height: 256px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 2px solid rgba(239, 68, 68, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      padding: 12px;
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 50%, #991b1b 100%);
      box-shadow: 0 10px 35px rgba(239, 68, 68, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .circle-button:active {
      transform: scale(0.96);
    }
    .inner-glass {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .button-icon {
      font-size: 48px;
      margin-bottom: 6px;
    }
    .button-text {
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }
    .help-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }
    .footer-note {
      color: #64748b;
      font-size: 12px;
      margin-top: 38px;
      letter-spacing: 0.8px;
      text-align: center;
    }

    /* Pantallas Secundarias */
    .sub-header {
      padding: 20px 20px 16px;
      text-align: center;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .back-btn {
      position: absolute;
      left: 16px;
      top: 22px;
      color: #38bdf8;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .tabs-bar {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .tab-item {
      flex: 1;
      padding: 13px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }
    .tab-item.active {
      color: #38bdf8;
      border-bottom: 2px solid #38bdf8;
    }

    .scroll-body {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .app-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
    }
    .card-title {
      color: #f8fafc;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .card-desc {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
    }
    .loc-btn {
      margin-top: 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 9px;
      border-radius: 8px;
      text-align: center;
      color: #38bdf8;
      font-weight: 700;
      font-size: 13px;
    }

    /* Mi Cuenta */
    .success-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 15px;
      padding: 18px;
      text-align: center;
    }
    .mp-btn {
      background: #009EE3;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      margin-top: 14px;
    }
    .input-mock {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    /* Sonidos en Mi Perfil */
    .sound-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 10px 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      margin-top: 8px;
    }
    .sound-option.selected {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }
    .radio-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .sound-option.selected .radio-circle {
      border-color: #ef4444;
    }
    .radio-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
    }
    .preview-pill {
      padding: 5px 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- PANEL LATERAL -->
  <aside class="sidebar">
    <div class="brand-header">
      <div class="logo-badge">🚨</div>
      <div>
        <h1>BVV Emergencias</h1>
        <p>Emulador & Capturas Google Play</p>
      </div>
    </div>

    <div class="control-group" style="gap: 8px; background: rgba(239, 68, 68, 0.08); padding: 12px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.3);">
      <div class="control-label" style="color: #fca5a5;">📸 Guardar Capturas (PNG Oficial)</div>
      <button class="action-btn" onclick="downloadCurrentScreenshot()" id="btn-download-one">
        📸 Descargar esta captura (PNG)
      </button>
      <button class="action-btn secondary" onclick="downloadAllScreenshots()" id="btn-download-all">
        📦 Descargar las 7 capturas juntas
      </button>
      <p id="status-msg" style="font-size: 11px; color: #cbd5e1; line-height: 1.35; text-align: center;">
        Se descargarán en tu carpeta <b>Descargas</b> listas para Play Console.
      </p>
    </div>

    <div class="control-group">
      <div class="control-label">1. Seleccionar Pantalla</div>
      <div class="screen-list">
        <button class="screen-btn active" onclick="setScreen(1)" id="btn-s1">
          <span>1. Inicio SOS (Botón Único)</span>
          <span class="tag">OBLIGATORIA</span>
        </button>
        <button class="screen-btn" onclick="setScreen(2)" id="btn-s2">
          <span>2. Inicio + Menú Desplegable</span>
        </button>
        <button class="screen-btn" onclick="setScreen(3)" id="btn-s3">
          <span>3. Cuenta Regresiva SOS (5s)</span>
        </button>
        <button class="screen-btn" onclick="setScreen(4)" id="btn-s4">
          <span>4. ¡Ayuda en Camino! 🚒</span>
        </button>
        <button class="screen-btn" onclick="setScreen(5)" id="btn-s5">
          <span>5. Centro de Avisos Oficiales</span>
        </button>
        <button class="screen-btn" onclick="setScreen(6)" id="btn-s6">
          <span>6. Mi Cuenta y Donaciones</span>
        </button>
        <button class="screen-btn" onclick="setScreen(7)" id="btn-s7">
          <span>7. Mi Perfil y Sirenas de Alerta</span>
        </button>
        <button class="screen-btn" onclick="setScreen(8)" id="btn-s8">
          <span>🌐 Ver App en Vivo (localhost:8081)</span>
        </button>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">2. Formato de Dispositivo</div>
      <div class="format-row">
        <button class="format-btn active" id="fmt-phone" onclick="setDeviceFormat('phone')">
          📱 Teléfono (9:16)<br><small style="color:#94a3b8">1080 × 1920 px</small>
        </button>
        <button class="format-btn" id="fmt-tablet" onclick="setDeviceFormat('tablet')">
          📟 Tablet (7" / 10")<br><small style="color:#94a3b8">1200 × 1600 px</small>
        </button>
      </div>
    </div>
  </aside>

  <!-- ÁREA DEL EMULADOR -->
  <main class="workspace">
    <div class="top-banner" style="gap: 12px;">
      <button class="action-btn" style="padding: 8px 16px; font-size: 13px;" onclick="downloadCurrentScreenshot()">
        📸 Descargar esta captura (PNG)
      </button>
      <button class="action-btn secondary" style="padding: 8px 16px; font-size: 13px;" onclick="downloadAllScreenshots()">
        📦 Descargar las 7 capturas
      </button>
    </div>

    <div class="device-frame" id="device-frame">
      <!-- Barra de estado Android -->
      <div class="android-status-bar" id="status-bar">
        <span>09:41</span>
        <div class="status-icons">
          <span>📍 GPS</span>
          <span>5G</span>
          <span>📶</span>
          <span>🔋 100%</span>
        </div>
      </div>

      <!-- Pantalla Renderizada -->
      <div class="app-screen" id="app-screen"></div>

      <!-- Barra inferior Android -->
      <div class="android-nav-bar">
        <div class="nav-pill"></div>
      </div>
    </div>
  </main>

  <script>
    let currentScreen = 1;
    let menuOpen = false;

    function getScreenHTML(screenId) {
      // PANTALLA 1 y 2: INICIO SOS (Botón Único)
      if (screenId === 1 || screenId === 2) {
        const showMenu = screenId === 2 || menuOpen;
        return `
          <div class="bvv-header">
            <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
            <div class="header-titles">
              <div class="bvv-title">BVV Emergencias</div>
              <div class="bvv-subtitle">Bomberos Verónica</div>
            </div>
          </div>

          ${showMenu ? `
          <div class="dropdown-menu">
            <div class="menu-item" onclick="setScreen(1)">🏠 Pantalla de Inicio (SOS)</div>
            <div class="menu-divider"></div>
            <div class="menu-item" onclick="setScreen(5)">🔔 Centro de Avisos</div>
            <div class="menu-divider"></div>
            <div class="menu-item" onclick="setScreen(6)">💳 Pasarela de Pagos (Mi Cuenta)</div>
            <div class="menu-divider"></div>
            <div class="menu-item" onclick="setScreen(7)">👤 Mi Perfil</div>
          </div>
          ` : ''}

          <div class="main-content">
            <div class="instruction-card">
              <div class="instruction-badge">CENTRAL DE EMERGENCIAS</div>
              <div class="instruction-text">
                En caso de urgencia, mantén presionado el botón. Tu llamado y ubicación GPS llegarán en tiempo real al cuartel.
              </div>
            </div>

            <div class="button-outer-pulse">
              <div class="circle-button" onclick="setScreen(3)">
                <div class="inner-glass">
                  <div class="button-icon">🚨</div>
                  <div class="button-text">AYUDA</div>
                  <div class="help-text">Mantener presionado</div>
                </div>
              </div>
            </div>

            <div class="footer-note">
              🛡️ Servicio público de auxilio gratuito 24 hs • Verónica
            </div>
          </div>
        `;
      }

      // PANTALLA 3: CUENTA REGRESIVA SOS
      if (screenId === 3) {
        return `
          <div style="flex:1; background: linear-gradient(180deg, #7f1d1d 0%, #000000 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 24px; text-align:center;">
            <div style="color:#f87171; font-size:21px; font-weight:800; letter-spacing:2px;">PEDIDO DE AYUDA INICIADO</div>
            <div style="color:#fff; font-size:112px; font-weight:900; margin: 18px 0;">4</div>

    function setScreen(id) {
      currentScreen = id;
      menuOpen = (id === 2);
      document.querySelectorAll('.screen-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-s' + id);
      if (activeBtn) activeBtn.classList.add('active');
      document.getElementById('app-screen').innerHTML = getScreenHTML(id);
    }

    function toggleMenu() {
      menuOpen = !menuOpen;
      document.getElementById('app-screen').innerHTML = getScreenHTML(1);
    }

    function setDeviceFormat(fmt) {
      const frame = document.getElementById('device-frame');
      document.getElementById('fmt-phone').classList.toggle('active', fmt === 'phone');
      document.getElementById('fmt-tablet').classList.toggle('active', fmt === 'tablet');
      if (fmt === 'tablet') {
        frame.classList.add('tablet');
      } else {
        frame.classList.remove('tablet');
      }
    }

    // Inicializar según parámetros URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('capture') === '1') {
      document.body.classList.add('capture-mode');
    }
    const initialScreen = parseInt(params.get('screen') || '1', 10);
    setScreen(initialScreen);

    const SCREEN_NAMES = {
      1: '01_inicio_boton_unico_sos',
      2: '02_menu_navegacion',
      3: '03_cuenta_regresiva_emergencia',
      4: '04_ayuda_en_camino',
      5: '05_centro_de_avisos',
      6: '06_mi_cuenta_donaciones',
      7: '07_mi_perfil_sonidos_alerta'
    };

    async function captureFrameToPng(filename) {
      const frame = document.getElementById('device-frame');
      const isTablet = frame.classList.contains('tablet');
      const statusEl = document.getElementById('status-msg');
      if (statusEl) statusEl.textContent = 'Generando ' + filename + '.png...';

      // Ocultar temporalmente el borde redondeado del marco exterior para exportar captura limpia 100% pantalla
      const prevBorder = frame.style.border;
      const prevRadius = frame.style.borderRadius;
      const prevShadow = frame.style.boxShadow;
      frame.style.border = 'none';
      frame.style.borderRadius = '0px';
      frame.style.boxShadow = 'none';

      await new Promise(r => setTimeout(r, 80));

      const scale = isTablet ? 2.5 : 3;
      const canvas = await html2canvas(frame, {
        backgroundColor: '#000000',
        scale: scale,
        useCORS: true,
        logging: false
      });

      frame.style.border = prevBorder;
      frame.style.borderRadius = prevRadius;
      frame.style.boxShadow = prevShadow;

      const link = document.createElement('a');
      link.download = filename + (isTablet ? '_tablet' : '_telefono') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();

      if (statusEl) statusEl.textContent = '✅ ¡Captura descargada! (' + link.download + ')';
    }

    async function downloadCurrentScreenshot() {
      if (currentScreen === 8) {
        alert('Para capturar con 1 clic selecciona cualquiera de las pantallas 1 a 7 de la lista.');
        return;
      }
      const name = SCREEN_NAMES[currentScreen] || ('captura_' + currentScreen);
      await captureFrameToPng(name);
    }

    async function downloadAllScreenshots() {
      const orig = currentScreen;
      for (let i = 1; i <= 7; i++) {
        setScreen(i);
        await new Promise(r => setTimeout(r, 150));
        await captureFrameToPng(SCREEN_NAMES[i]);
        await new Promise(r => setTimeout(r, 250));
      }
      setScreen(orig);
      const statusEl = document.getElementById('status-msg');
      if (statusEl) statusEl.textContent = '🎉 ¡Las 7 capturas PNG fueron descargadas en tu carpeta de Descargas!';
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
